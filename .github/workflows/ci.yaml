name: Foundation CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - run: pip install uv==0.12.16
      - run: uv sync --project apps/api --frozen
      - run: infrastructure/scripts/check-python.sh
      - run: uv build --project apps/api
      - run: uv export --project apps/api --frozen --no-dev --no-emit-project --format requirements-txt -o /tmp/api-requirements.txt
      - run: uv run --project apps/api pip-audit -r /tmp/api-requirements.txt
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - run: npm install --global pnpm@12.4.2
      - run: pip install uv==0.12.16
      - run: uv sync --project apps/api --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm web:check
      - run: pnpm web:test
      - run: pnpm web:build
      - run: PATH="$PWD/apps/api/.venv/bin:$PATH" pnpm api:drift
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm audit --prod --audit-level high
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: false
      - run: infrastructure/scripts/check-go.sh
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25.0.4+101.0.LTS"
      - uses: gradle/actions/wrapper-validation@v4
      - name: Run Paper validation
        run: |
          set -o pipefail
          integrations/minecraft-paper/gradlew -p integrations/minecraft-paper clean spotlessCheck test build --no-daemon 2>&1 | tee /tmp/paper-gradle.log
      - name: Summarize Paper failure
        if: failure()
        run: |
          failure=$(awk '/\* What went wrong:/{found=1; next} found && NF {print; count++; if (count == 4) exit}' /tmp/paper-gradle.log | tr '\n' ' ')
          if [ -z "$failure" ]; then
            failure=$(grep -m1 -E 'Execution failed for task|[Ee]rror:' /tmp/paper-gradle.log || true)
          fi
          failure=${failure:-"Paper Gradle validation failed; see log tail below."}
          echo "::error title=Paper Gradle validation failed::$failure"
          {
            echo '## Paper Gradle failure'
            echo
            echo "- Exit status: failed"
            echo "- First failure: $failure"
            echo
            echo '```text'
            tail -80 /tmp/paper-gradle.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: paper-gradle-diagnostics
          path: |
            integrations/minecraft-paper/.gradle
            integrations/minecraft-paper/build/reports
          if-no-files-found: warn
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - run: pip install uv==0.12.16
      - run: uv sync --project apps/api --frozen
      - run: infrastructure/scripts/verify-compose.sh
      - run: infrastructure/scripts/verify-production.sh
      - uses: anchore/scan-action@v6
        with:
          image: server-operations-api:foundation-test
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: api-grype.json
      - uses: anchore/scan-action@v6
        with:
          image: server-operations-web:foundation-test
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: web-grype.json
      - name: Summarize container vulnerabilities
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, json, os
          for report in glob.glob("*-grype.json"):
              image = report.removesuffix("-grype.json")
              for match in json.load(open(report))["matches"]:
                  vulnerability = match["vulnerability"]
                  if vulnerability["severity"] not in {"High", "Critical"}:
                      continue
                  artifact = match["artifact"]
                  fixed = ", ".join(vulnerability["fix"]["versions"]) or "no fix listed"
                  print(f"::error title={image} {vulnerability['severity']} {vulnerability['id']}::{artifact['name']} {artifact['version']} ({artifact['type']}); fixed: {fixed}")
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-vulnerability-diagnostics
          path: "*-grype.json"
          if-no-files-found: warn
