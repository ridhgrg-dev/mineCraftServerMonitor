name: Foundation CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - run: pip install uv==0.12.16
      - run: uv sync --project apps/api --frozen
      - run: infrastructure/scripts/check-python.sh
      - run: uv build --project apps/api
      - run: uv export --project apps/api --frozen --no-dev --no-emit-project --format requirements-txt -o /tmp/api-requirements.txt
      - run: uv run --project apps/api pip-audit -r /tmp/api-requirements.txt
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - run: npm install --global pnpm@12.4.2
      - run: pip install uv==0.12.16
      - run: uv sync --project apps/api --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm web:check
      - run: pnpm web:test
      - run: pnpm web:build
      - run: PATH="$PWD/apps/api/.venv/bin:$PATH" pnpm api:drift
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm audit --prod --audit-level high
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: false
      - run: infrastructure/scripts/check-go.sh
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25.0.4+101.0.LTS"
      - uses: gradle/actions/wrapper-validation@v4
      - run: integrations/minecraft-paper/gradlew -p integrations/minecraft-paper spotlessCheck test build --no-daemon
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - run: pip install uv==0.12.16
      - run: uv sync --project apps/api --frozen
      - run: infrastructure/scripts/verify-compose.sh
      - run: infrastructure/scripts/verify-production.sh
      - uses: anchore/scan-action@v6
        with:
          image: server-operations-api:foundation-test
          fail-build: true
          severity-cutoff: high
      - uses: anchore/scan-action@v6
        with:
          image: server-operations-web:foundation-test
          fail-build: true
          severity-cutoff: high
