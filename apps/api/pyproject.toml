[project]
name = "control-plane"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi==0.141.1", "uvicorn==0.53.0", "pydantic-settings==2.15.0", "sqlalchemy[asyncio]==2.0.54", "alembic==1.20.0", "psycopg[binary]==3.3.6", "redis==8.1.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "httpx==0.28.1", "ruff==0.16.8", "mypy==2.3.1", "jsonschema==4.26.0", "types-jsonschema==4.26.0.20260518", "pyyaml==6.0.3", "types-pyyaml==6.0.12.20260906", "pip-audit==2.10.1"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_plane"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires real PostgreSQL/Redis services"]
