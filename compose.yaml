name: server-operations-dev
x-api: &api
  build:
    context: .
    dockerfile: infrastructure/docker/api.Dockerfile
  environment: &app-env
    APP_ENVIRONMENT: development
    APP_DATABASE_URL: postgresql+psycopg://platform_app:${APP_DB_PASSWORD:?Run setup-dev.py}@postgres:5432/platform
    APP_REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres:
      condition: service_healthy
  init: true
services:
  postgres:
    build:
      context: .
      dockerfile: infrastructure/docker/postgres.Dockerfile
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup-dev.py}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run setup-dev.py}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Run setup-dev.py}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d platform"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.10.1-alpine@sha256:bd999b5cfee25fb24b8320a31fddbd69f462df44c8138c66e369582937beebc0
    command: [redis-server, --save, "", --appendonly, "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    <<: *api
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *api
    command: [python, -m, control_plane.worker]
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "from pathlib import Path; assert Path('/tmp/control-plane-worker.ready').exists()",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
  migrate:
    <<: *api
    profiles: [tools]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://platform_migrator:${MIGRATION_DB_PASSWORD:?Run setup-dev.py}@postgres:5432/platform
    command: [alembic, upgrade, head]
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    init: true
volumes:
  postgres-data:
